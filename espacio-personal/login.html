<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ingresar — Equipar para Equipar</title>
    <link rel="icon" href="../assets/img/logo-epe.png" />

    <script src="../js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/base/tokens.css" />
    <link rel="stylesheet" href="../css/base/theme.css" />
    <link rel="stylesheet" href="../css/base/typography.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/atribucion.css" />
    <link rel="stylesheet" href="../css/components/form-field.css" />
    <link rel="stylesheet" href="../css/features/perfil/login.css" />
  </head>
  <body>
    <div class="epe-login-shell">
      <div class="epe-login-card">
        <img class="epe-logo-chip" src="../assets/img/logo-epe.png" alt="Equipar para Equipar" />
        <h1>Espacio personal</h1>
        <p class="epe-login-sub">Ingresá para gestionar tu perfil y tus casos.</p>

        <form class="epe-login-form" data-login-form>
          <div class="epe-field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" required autocomplete="email" />
          </div>
          <div class="epe-field">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" name="password" required autocomplete="current-password" />
          </div>

          <div data-signup-fields hidden>
            <p class="epe-login-sub">Contanos un poco de vos — podés completarlo después si preferís.</p>

            <div class="epe-field">
              <label for="signup-nombre">Nombre</label>
              <input type="text" id="signup-nombre" name="nombre" autocomplete="name" />
            </div>
            <div class="epe-field">
              <label for="signup-profesion">Profesión</label>
              <input type="text" id="signup-profesion" name="profesion" />
            </div>
            <div class="epe-field">
              <label for="signup-institucion">Institución</label>
              <input type="text" id="signup-institucion" name="institucion" />
            </div>
            <div class="epe-field">
              <label for="signup-telefono">Teléfono (opcional)</label>
              <input type="tel" id="signup-telefono" name="telefono" autocomplete="tel" />
            </div>
            <div class="epe-field">
              <label for="signup-localidad">Localidad (opcional)</label>
              <input type="text" id="signup-localidad" name="localidad" autocomplete="address-level2" />
            </div>
            <div class="epe-field">
              <label for="signup-email-contacto">Correo de contacto (opcional)</label>
              <input type="email" id="signup-email-contacto" name="email_contacto" autocomplete="email" />
            </div>
          </div>

          <button class="epe-btn-acc" type="submit">Ingresar</button>
          <p class="epe-form-status" data-login-status></p>
        </form>

        <p class="epe-login-note">
          <a href="#" data-login-toggle>¿No tenés cuenta? Creá una</a>
        </p>
        <p class="epe-login-note">
          <a href="#" data-login-olvide>¿Olvidaste tu contraseña?</a>
        </p>

        <a class="epe-login-back" href="../index.html">← Volver al inicio</a>

        <div data-atribucion="pie"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/core/supabase-client.js"></script>
    <script src="../js/core/theme.js"></script>
    <script src="../js/core/atribucion.js"></script>
    <script src="../js/features/perfil/auth.js"></script>
    <script src="../js/features/perfil/data/schema.js"></script>
    <script src="../js/features/perfil/data/store.js"></script>
    <script src="../js/features/perfil/login.js"></script>
  </body>
</html>
