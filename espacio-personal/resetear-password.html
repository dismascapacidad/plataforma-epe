<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva contraseña — Equipar para Equipar</title>
    <link rel="icon" href="../assets/img/logo-epe.png" />

    <script src="../js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/base/tokens.css" />
    <link rel="stylesheet" href="../css/base/theme.css" />
    <link rel="stylesheet" href="../css/base/typography.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/features/perfil/login.css" />
  </head>
  <body>
    <div class="epe-login-shell">
      <div class="epe-login-card">
        <img src="../assets/img/logo-epe.png" alt="Equipar para Equipar" />
        <h1>Nueva contraseña</h1>
        <p class="epe-login-sub" data-reset-sub>Verificando el link…</p>

        <form class="epe-login-form" data-reset-form hidden>
          <div class="epe-field">
            <label for="reset-password">Contraseña nueva</label>
            <input type="password" id="reset-password" name="password" required autocomplete="new-password" minlength="6" />
          </div>
          <button class="epe-btn-acc" type="submit">Guardar contraseña</button>
          <p class="epe-form-status" data-reset-status></p>
        </form>

        <a class="epe-login-back" href="login.html">← Volver a ingresar</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="../js/core/supabase-client.js"></script>
    <script src="../js/core/theme.js"></script>
    <script src="../js/features/perfil/auth.js"></script>
    <script src="../js/features/perfil/resetear-password.js"></script>
  </body>
</html>
