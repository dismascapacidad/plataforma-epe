<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano — Apps EpE</title>
    <link rel="icon" href="../assets/img/logo-epe.png" />

    <script src="../js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/diseno/fonts.css" />
    <link rel="stylesheet" href="../css/diseno/tokens.css" />
    <link rel="stylesheet" href="../css/diseno/theme.css" />
    <link rel="stylesheet" href="../css/base/plataforma.css" />
    <link rel="stylesheet" href="../css/base/typography.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/atribucion.css" />
    <link rel="stylesheet" href="../css/components/app-nav.css" />
    <link rel="stylesheet" href="../css/components/juego-base.css" />
    <link rel="stylesheet" href="../css/components/modal.css" />
    <link rel="stylesheet" href="../css/features/apps-epe/piano.css" />
    <link rel="stylesheet" href="../css/features/configurar-dispositivo/widget.css" />
  </head>
  <body>
    <div class="epe-piano-shell">
      <header class="epe-piano-header">
        <div class="epe-app-header-left">
          <a class="epe-app-back" href="index.html" data-volver-apps>← Apps EpE</a>
          <a href="../index.html"><img class="epe-logo-chip" src="../assets/img/logo-epe.png" alt="Equipar para Equipar" height="26" /></a>
        </div>
        <button
          class="epe-theme-toggle"
          type="button"
          id="theme-toggle"
          aria-pressed="false"
          aria-label="Cambiar a modo oscuro"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
          </svg>
        </button>
      </header>

      <!-- ── Configuración: modal, se cierra solo al Empezar; con el juego
           iniciado, Escape vuelve a abrirlo sin perder nada — mismo criterio
           que Vincular Imagen, porque acá tampoco hay una "partida" que
           termine. ── -->
      <div class="epe-juego-overlay" data-piano-config>
        <div class="epe-juego-modal">
          <h1>Piano de 7 notas</h1>
          <p class="epe-juego-intro">Tocá con el mouse, el dedo, o las teclas A S D F G H J del teclado.</p>

          <div class="epe-piano-dispositivo">
            <button class="epe-btn-ghost" type="button" data-configurar-dispositivo>
              Configurar dispositivo…
            </button>
            <button class="epe-btn-ghost" type="button" data-restaurar-dispositivo hidden>
              Restaurar dispositivo
            </button>
          </div>

          <div class="epe-juego-pie">
            <a class="epe-btn-ghost" href="index.html" data-volver-apps>Volver a Apps EpE</a>
            <div data-atribucion="by"></div>
            <button class="epe-btn-acc" type="button" data-piano-empezar>Empezar</button>
          </div>
        </div>
      </div>

      <main class="epe-juego-main">
        <div class="epe-piano-teclado" data-piano-teclado hidden></div>
      </main>
    </div>

    <script src="../js/core/theme.js"></script>
    <script src="../js/core/atribucion.js"></script>
    <script src="../js/core/ajuste-modal.js"></script>
    <script src="../js/core/modal.js"></script>
    <script type="module" src="../js/features/configurar-dispositivo/widget.js"></script>
    <script src="../js/features/apps-epe/piano/piano.js"></script>
    <script>
      EpeTheme.initThemeToggle(document.getElementById("theme-toggle"));
      EpePiano.init(document.querySelector(".epe-piano-shell"));
    </script>
  </body>
</html>
