<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vincular imagen — Apps EpE</title>
    <link rel="icon" href="../assets/img/logo-epe.png" />

    <script src="../js/core/theme-boot.js"></script>

    <link rel="stylesheet" href="../css/base/reset.css" />
    <link rel="stylesheet" href="../css/base/tokens.css" />
    <link rel="stylesheet" href="../css/base/theme.css" />
    <link rel="stylesheet" href="../css/base/typography.css" />
    <link rel="stylesheet" href="../css/components/buttons.css" />
    <link rel="stylesheet" href="../css/components/app-nav.css" />
    <link rel="stylesheet" href="../css/features/apps-epe/vincular-imagen.css" />
  </head>
  <body>
    <div class="epe-vi-shell">
      <header class="epe-vi-header">
        <div class="epe-app-header-left">
          <a class="epe-app-back" href="index.html">← Apps EpE</a>
          <a href="../index.html"><img src="../assets/img/logo-epe.png" alt="Equipar para Equipar" height="26" /></a>
        </div>
        <button
          class="epe-theme-toggle"
          type="button"
          id="theme-toggle"
          aria-pressed="false"
          aria-label="Cambiar a modo oscuro"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" />
          </svg>
        </button>
      </header>

      <div class="epe-vi-config">
        <label for="vi-cantidad">Cantidad de casilleros</label>
        <select id="vi-cantidad" data-vi-cantidad>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>

      <div class="epe-vi-grilla" data-vi-grilla></div>
    </div>

    <script src="../js/core/theme.js"></script>
    <script src="../js/features/apps-epe/vincular-imagen/vincular-imagen.js"></script>
    <script>
      EpeTheme.initThemeToggle(document.getElementById("theme-toggle"));
      EpeVincularImagen.init(document.querySelector(".epe-vi-shell"));
    </script>
  </body>
</html>
